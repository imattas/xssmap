name: ci

# Gates are ordered cheap-to-expensive so a formatting slip fails in seconds
# instead of after a full harness run.
#
# What each job is actually protecting:
#   lint     - style and dead-code drift (unused imports hide bugs)
#   types    - the shipped package only; tests and bench fixtures are not typed
#   units    - the pure logic: verifier tri-state, CSP parser, mXSS round trip,
#              charset trail bytes, throttle/Retry-After, resume state, report
#              rendering, SARIF shape
#   selftest - the end-to-end honesty gate: a scanner that reports "not tested"
#              as "clean" is worse than one that crashes, so this asserts both
#              recall on vulnerable routes AND no findings on safe ones
#   browser  - the same harness with real Chrome behind the DevTools protocol
#   publish  - the release: uploads to PyPI, but only when every gate above is
#              green and the PYPI_API_TOKEN secret exists

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs only for pull requests. On main a run can be inside
  # the upload step, and killing it halfway leaves a version half-published;
  # pushes and dispatches therefore queue behind each other instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: ruff check
        run: ruff check . --output-format=github

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: python -m pip install --disable-pip-version-check mypy
      - name: mypy (package only)
        # Scope is the shipped package. tests/ and bench/ are fixtures: typing
        # them would mean scattering ignores through assertions for no gain in
        # the code users actually run. Settings live in pyproject.toml, so this
        # command is the same one a contributor runs locally.
        run: mypy xssmap

  units:
    name: units (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the declared floor: it proves the source stays free of
          # newer syntax that ruff's py39 target alone cannot fully catch.
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          # Windows is the primary operator platform for this tool, and its
          # path/encoding quirks are where launcher bugs live.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: entry point smoke test
        run: python run.py --version

  selftest:
    name: selftest, browser-free (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: crawl + forms + stored against the vulnerable lab
        # No browser needed. Every route with a known-vulnerable sink must be
        # found, and the safe routes must stay silent.
        run: python tests/selftest.py --forms --stored

  browser:
    name: selftest, real browser
    runs-on: ubuntu-latest
    # Chrome ships with the ubuntu runner image and is found at
    # /usr/bin/google-chrome, which is in the candidate list. Kept advisory:
    # headless timing on shared runners is genuinely variable, and a flaky red
    # X trains people to ignore CI. Promote to blocking once it has been stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: confirm a browser is present
        run: google-chrome --version
      - name: full harness with DevTools verification
        run: python tests/selftest.py --browser --forms --stored
      - name: upload harness output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-browser-output
          path: |
            *.json
            *.sarif
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    # Every gate must pass first. `browser` is advisory (continue-on-error), so
    # it is listed for ordering but cannot hold a release back.
    needs: [lint, types, units, selftest, browser]
    # A pull request is a proposal, not a release, and fork PRs have no token.
    if: github.event_name != 'pull_request'
    # Serialise releases on their own group: a push and a manual dispatch (or a
    # re-run) can both reach this job, and two concurrent uploads of the same
    # version race each other. Never cancel one mid-upload, or the release is
    # left half-published.
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether the PyPI token is configured
        id: gate
        # A missing secret must not fail the run: the workflow has to stay green
        # until the token is added, and `secrets` cannot be referenced in an
        # `if:` expression. So the presence test happens here, in a step.
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=PyPI upload skipped::PYPI_API_TOKEN is not set in this repository."
          fi

      - name: Build sdist and wheel
        if: steps.gate.outputs.present == 'true'
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*

      - name: Artefact version matches the package
        if: steps.gate.outputs.present == 'true'
        # The version is dynamic (read from xssmap/__init__.py). If the tag, the
        # source and the build ever disagree, fail here rather than shipping a
        # release whose files are named after a version nobody intended.
        run: |
          version="$(python run.py --version | awk '{print $NF}')"
          echo "declared version: $version"
          for artefact in dist/*.tar.gz dist/*.whl; do
            case "$artefact" in
              *"-$version"*) echo "ok: $artefact" ;;
              *) echo "::error::$(basename "$artefact") does not match __version__ $version"; exit 1 ;;
            esac
          done

      - name: Upload to PyPI
        if: steps.gate.outputs.present == 'true'
        # skip-existing makes a re-run of an already-released version a no-op
        # instead of a red X, which matters because every push to main reaches
        # this job.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true
